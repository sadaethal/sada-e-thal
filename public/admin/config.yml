backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blogs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Featured Image", name: "image", widget: "image"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Slug", name: "slug", widget: "string"}
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - {label: "Blog", value: "blog"}
          - {label: "Opinion / Editorial", value: "opinion"}
          - {label: "News", value: "news"}
        default: "blog"
        required: false
      - label: "External Link"
        name: "external_link"
        widget: "string"
        required: false
        hint: "Optional: Add a YouTube, Facebook, or any external URL. A button will appear on the blog page."
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "team"
    label: "Our Team"
    folder: "content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Designation", name: "designation", widget: "string"}
      - label: "Registration Number"
        name: "registration_number"
        widget: "string"
        hint: "Format: stmn001, stmn002, stmn003..."
        pattern: ["^stmn\\d+$", "Must be in format stmn001, stmn002, etc."]
        required: true
      - {label: "CNIC", name: "cnic", widget: "string", required: false, hint: "e.g. 12345-6789012-3"}
      - {label: "Phone", name: "phone", widget: "string", required: false}
      - {label: "Location", name: "location", widget: "string", required: false}
      - {label: "Profile Image", name: "image", widget: "image", required: false}
      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "URL-friendly identifier, auto-fill from name (lowercase, hyphens). e.g. john-doe"
